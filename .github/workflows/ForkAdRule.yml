name: Fork AdRule

on:
  workflow_dispatch:
  schedule:
    - cron: "15 20,8 * * *"

jobs:
  ForkAdRule:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Shanghai'

    steps:
    - name: Checkout target repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }} 

    - name: Create directories
      run: | 
        mkdir -p temp
        mkdir -p Clash/AdRule
        mkdir -p Egern/AdRule
        mkdir -p Loon/AdRule
        mkdir -p QuantumultX/AdRule
        mkdir -p Shadowrocket/AdRule
        mkdir -p Stash/AdRule
        mkdir -p X/AdRule

    - name: Clone initial files
      run: |
        declare -A initial_urls=(
          ["adrules.list"]="https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules.list"
          ["adblockloon.list"]="https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockloon.list"
        )
        for file in "${!initial_urls[@]}"; do
          curl -sSL -o "temp/$file" "${initial_urls[$file]}"
        done

    - name: Process initial files
      run: |
        process_file() {
          local input1=$1
          local input2=$2
          local output=$3
          local transformations=$4
          local rule_name=$5

          creation_date=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")
          cat "$input1" "$input2" | sort -u > tmpfile
          sed -i -e '/^\s*[#;]/d' -e '/^$/d' tmpfile
          eval "$transformations"
          local rule_count=$(wc -l < tmpfile | tr -d ' ')

          # 添加规则名称到文件
          {
            echo "# 规则名称: $rule_name"
            echo "# 规则数量: $rule_count"
            echo "# 更新时间: $creation_date"
          } > "$output"
           if [[ "$output" == QuantumultX/AdRule/AdBlock.list ]]; then
            awk -v rule_name="$rule_name" '!/^#|^ *$/ {print $0","rule_name; next} {print}' tmpfile >> "$output"
          else
            cat tmpfile >> "$output"
          fi

          sed -i '3a\\' "$output"
          rm tmpfile
        }

        # 调用处理函数
        process_file "temp/adrules.list" "temp/adblockloon.list" "X/AdRule/AdBlock.list" "" "AdBlock"
        process_file "temp/adrules.list" "temp/adblockloon.list" "Loon/AdRule/AdBlock.lsr" "" "AdBlock"
        process_file "temp/adrules.list" "temp/adblockloon.list" "Shadowrocket/AdRule/AdBlock.list" "" "AdBlock"
        process_file "temp/adrules.list" "temp/adblockloon.list" "QuantumultX/AdRule/AdBlock.list" "sed -i -e 's/DOMAIN-SUFFIX,/HOST-SUFFIX,/g' tmpfile" "AdBlock"
        process_file "temp/adrules.list" "temp/adblockloon.list" "Egern/AdRule/AdBlock.yaml" "sed -i -e 's/DOMAIN-SUFFIX,/- /g' tmpfile && sed -i '1i\no_resolve: true' tmpfile && sed -i '2i\domain_suffix_set:' tmpfile" "AdBlock"
        process_file "temp/adrules.list" "temp/adblockloon.list" "Stash/AdRule/AdBlock.txt" "sed -i -e 's/DOMAIN-SUFFIX,/+./g' tmpfile" "AdBlock"
        process_file "temp/adrules.list" "temp/adblockloon.list" "Stash/AdRule/AdBlock.yaml" "sed -i 's/^DOMAIN-SUFFIX,/  - \x27+./g' tmpfile && sed -i 's/$/\x27/' tmpfile && sed -i '1i\payload:' tmpfile" "AdBlock"
        process_file "temp/adrules.list" "temp/adblockloon.list" "Clash/AdRule/AdBlock.txt" "sed -i -e 's/DOMAIN-SUFFIX,/+./g' tmpfile" "AdBlock"
        process_file "temp/adrules.list" "temp/adblockloon.list" "Clash/AdRule/AdBlock.yaml" "sed -i 's/^DOMAIN-SUFFIX,/  - \x27+./g' tmpfile && sed -i 's/$/\x27/' tmpfile && sed -i '1i\payload:' tmpfile" "AdBlock"

    - name: Cleanup temp directory
      run: rm -rf temp

    - name: Add and Commit
      run: |
        if [[ -n $(git status -s) ]]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Auto Update $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin X
          git push origin X  
        else
          echo "No changes to commit."
        fi
        
    - name: Cleanup Workflow
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2
