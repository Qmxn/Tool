name: 高德地图去广告
description: 过滤高德地图开屏广告、各页面推广，精简我的页面。
icon: https://github.com/Qmxn/Tool/raw/X/icon/icon/XD.png
dns: {}
rules:
- domain:
    match: amap-aos-info-nogw.amap.com
    policy: REJECT
- domain:
    match: free-aos-cdn-image.amap.com
    policy: REJECT
- domain_suffix:
    match: v.smtcdns.com
    policy: REJECT
map_locals:
- match: ^https:\/\/m5\.amap\.com\/ws\/shield\/search\/new_hotword\?
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https:\/\/m5\.amap\.com\/ws\/faas\/amap-navigation\/card-service-(?:car-end|route-plan)
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https:\/\/m5\.amap\.com\/ws\/shield\/search_poi\/tips_adv\?
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https:\/\/oss\.amap\.com\/ws\/banner\/lists\/\?
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https:\/\/ai\.amap\.com\/v1\/ai_rec\/
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https:\/\/m5\.amap\.com\/ws\/aos\/main\/page\/product\/list\?
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https:\/\/m5\.amap\.com\/ws\/faas\/amap-navigation\/(?:main-page-assets|main-page-location|ridewalk-end-fc|usr-profile-fc\/homeV2)
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https:\/\/m5\.amap\.com\/ws\/(?:mapapi\/hint_text\/offline_data|message\/notice\/list|shield\/search\/new_hotword)
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https:\/\/m5\.amap\.com\/ws\/shield\/scene\/recommend\?
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https:\/\/m5\.amap\.com\/ws\/valueadded\/weather\/v2\?
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https:\/\/sns\.amap\.com\/ws\/msgbox\/pull_mp\?
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https:\/\/m5-zb\.amap\.com\/ws\/boss\/(?:order\/car\/(?:feedback\/get_card_questions|feedback\/viptips|king_toolbox_car_bubble|remark\/satisfactionConf|rights_information)|tips\/onscene_visual_optimization)
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https:\/\/m5-zb\.amap\.com\/ws\/boss\/(?:pay\/web\/paySuccess\/info\/request|transportation\/diversion\/resource\/driving)
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
scriptings:
- http_response:
    name: body_rewrite_19
    match: ^https:\/\/m5\.amap\.com\/ws\/shield\/search_business\/process\/marketingOperationStructured\?
    script_url: https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/scripts/body-rewrite.js
    env:
      _compat.$argument: '[["json-del",["data.commonMaterial","data.tipsOperationLocation","data.resourcePlacement"]]]'
    max_size: -1
    timeout: 30
    body_required: true
- http_response:
    name: body_rewrite_20
    match: ^https:\/\/m5\.amap\.com\/ws\/shield\/search_poi\/homepage\?
    script_url: https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/scripts/body-rewrite.js
    env:
      _compat.$argument: '[["json-del",["history_tags"]]]'
    max_size: -1
    timeout: 30
    body_required: true
- http_response:
    name: body_rewrite_32
    match: ^https:\/\/m5-zb\.amap\.com\/ws\/sharedtrip\/taxi\/order_detail_car_tips\?
    script_url: https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/scripts/body-rewrite.js
    env:
      _compat.$argument: '[["json-del",["data.carTips.data.popupInfo"]]]'
    max_size: -1
    timeout: 30
    body_required: true
- http_response:
    name: 移除路线规划推广
    match: ^https:\/\/m5\.amap\.com\/ws\/aos\/perception\/publicTravel\/beforeNavi\?
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
- http_response:
    name: 移除路线规划、导航结束页推广
    match: ^https:\/\/m5\.amap\.com\/ws\/bus\/plan\/integrate\?
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
- http_response:
    name: 移除导航详情页底部酒店、处理附近页
    match: ^https:\/\/m5\.amap\.com\/ws\/c3frontend\/(?:af-(?:hotel|launch)\/page\/main|af-nearby\/nearby)
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
- http_response:
    name: 移除路线规划推广
    match: ^https:\/\/m5\.amap\.com\/ws\/perception\/drive\/(?:routeInfo|routePlan)
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
- http_response:
    name: 移除搜索栏推广
    match: ^https:\/\/m5\.amap\.com\/ws\/shield\/search_bff\/hotword\?
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
- http_response:
    name: 移除搜索详情页推广
    match: ^https:\/\/m5\.amap\.com\/ws\/shield\/search_poi\/(?:mps|search\/sp|sug|tips_operation_location)
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
- http_response:
    name: 移除首页推广
    match: ^https:\/\/m5\.amap\.com\/ws\/faas\/amap-navigation\/(?:card-service-plan-home|main-page)
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
- http_response:
    name: 移除首页推广
    match: ^https:\/\/m5\.amap\.com\/ws\/shield\/frogserver\/aocs\/updatable\/1\?
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
- http_response:
    name: 移除我的页面推广
    match: ^https:\/\/m5\.amap\.com\/ws\/shield\/dsp\/profile\/index\/nodefaasv3\?
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
- http_response:
    name: 移除附近页推广
    match: ^https:\/\/m5\.amap\.com\/ws\/shield\/search\/nearbyrec_smart\?
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
- http_response:
    name: 移除开屏广告
    match: ^https:\/\/m5\.amap\.com\/ws\/valueadded\/alimama\/splash_screen\?
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
- http_response:
    name: 移除打车页推广卡片、弹窗
    match: ^https:\/\/m5-zb\.amap\.com\/ws\/boss\/(?:car\/order\/content_info|order_web\/friendly_information)
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
- http_response:
    name: 移除打车页红点角标、天气图标
    match: ^https:\/\/m5-zb\.amap\.com\/ws\/promotion-web\/resource(\/home)?\?
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
- http_response:
    name: 移除导航详情页推广
    match: ^https:\/\/(?:info|m5)\.amap\.com\/ws\/shield\/search\/(?:common\/coupon\/info|poi\/detail)
    script_url: https://kelee.one/Resource/JavaScript/Amap/Amap_remove_ads.js
    body_required: true
mitm:
  hostnames:
    includes:
    - '*.amap.com'
