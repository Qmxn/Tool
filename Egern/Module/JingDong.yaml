name: 京东去广告
description: 移除京东开屏广告，精简我的页面产品推广。
icon: https://github.com/Qmxn/Tool/raw/X/icon/icon/XD.png
dns: {}
rules:
- url_regex:
    match: ^http://\w{32}\.jddebug\.com/diagnose\?
    policy: REJECT
map_locals:
- match: ^https:\/\/api\.m\.jd\.com\/client\.action\?functionId=(searchBoxWord|stationPullService|uniformRecommend[06])
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
scriptings:
- http_response:
    name: body_rewrite_16
    match: ^https:\/\/api\.m\.jd\.com\/client\.action\?functionId=basicConfig
    script_url: https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/scripts/body-rewrite.js
    env:
      _compat.$argument: '[["json-replace",[["data.JDMessage.socketmonitor.isSocketEstablishedAhead",0],["data.JDMessage.socketmonitor.isSocketReport",0],["data.JDHttpToolKit.httpdns.httpdns",0]]]]'
    max_size: -1
    timeout: 30
    body_required: true
- http_response:
    name: 移除京东广告
    match: ^https:\/\/api\.m\.jd\.com\/client\.action\?functionId=(deliverLayer|getTabHomeInfo|myOrderInfo|orderTrackBusiness|personinfoBusiness|start|welcomeHome)
    script_url: https://kelee.one/Resource/JavaScript/JD/JD_remove_ads.js
    body_required: true
mitm:
  hostnames:
    includes:
    - api.m.jd.com
