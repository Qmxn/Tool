name: 微信公众号去广告
description: 过滤微信公众号广告
icon: https://github.com/Qmxn/Tool/raw/X/icon/icon/XD.png
dns: {}
rules:
- domain_suffix:
    match: wxs.qq.com
    policy: REJECT
map_locals:
- match: ^https:\/\/mp\.weixin\.qq\.com\/mp\/(cps_product_info|getappmsgad|jsmonitor|masonryfeed|relatedarticle)\?
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https:\/\/mp\.weixin\.qq\.com\/mp\/relatedsearchword
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
mitm:
  hostnames:
    includes:
    - mp.weixin.qq.com
