name: 可莉资源访问
description: 可莉资源浏览器的访问，适配特定客户端需求。

header_rewrites:
  - replace:
      match: ^https?://hub\.kelee\.one
      name: User-Agent
      value: StashCore/2.7.1 Stash/2.7.1 Clash/1.11.0
      type: request
  - add:
      match: ^https?://hub\.kelee\.one
      name: Content-Disposition
      value: inline
      type: response
  - replace:
      match: ^https?://hub\.kelee\.one
      name: Content-Type
      value: text/plain;charset=utf-8
      type: response

mitm:
  hostnames:
    includes:
      - hub.kelee.one
