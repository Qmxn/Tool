- geoip:
    match: CN
    policy: 直連服務
    disabled: false
- default:
    policy: 自選服務
url_rewrites:
- match: ^https?://(www.)?g.cn
  location: https://www.google.com
  status_code: 302
- match: ^https?://(www.)?google.cn
  location: https://www.google.com
  status_code: 302
mitm:
  enabled: true
modules:
- name: Spotify
  url: https://raw.githubusercontent.com/Qmxn/Tool/X/Egern/Module/Spotify.yaml
  enabled: true
- name: YouTube廣告攔截
  url: https://raw.githubusercontent.com/Qmxn/Tool/X/Egern/Module/YouTube.yaml
  enabled: true
- name: 重冩規則集轉換
  url: https://raw.githubusercontent.com/Qmxn/Tool/X/Egern/Module/Script-Hub.yaml
  enabled: true
- name: 訂閱管理工具
  url: https://raw.githubusercontent.com/Qmxn/Tool/X/Egern/Module/Sub-Store.yaml
  enabled: true
