ipv6: true
allow_external_connections: false
vif_only: false
hijack_dns:
- '*:53'
geoip_db_url: https://github.com/Qmxn/Tool/raw/X/iGeoIP/GeoCN/GeoCN.mmdb
proxy_latency_test_url: http://www.gstatic.com/generate_204
direct_latency_test_url: http://g.alicdn.com
dns:
  bootstrap:
    - system
  upstreams:
    ChinaDNS:
    - https://223.5.5.5
    - https://223.6.6.6
    GlobalDNS:
    - https://1.1.1.1
    - https://8.8.8.8
    - https://101.101.101.101
  forward:
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Qmxn/Tool/X/Egern/Rule/ChinaMaxNoIP/ChinaMaxNoIP.yaml
      value: ChinaDNS
  - wildcard:
      match: '*apple*'
      value: ChinaDNS
  - wildcard:
      match: '*'
      value: GlobalDNS
  proxy_nameservers:
  - https://dns.alidns.com/dns-query
  public_ip_lookup_url: https://ifconfig.me/ip
policy_groups:
- external:
    name: 自選服務
    type: select
    urls:
    - 此處填寫訂閱地址
    icon: https://raw.githubusercontent.com/Qmxn/Tool/X/icon/icon/Egern.png
    hidden: false
- select:
    name: 拒絕應答
    policies:
    - REJECT
    icon: https://raw.githubusercontent.com/Qmxn/Tool/X/icon/icon/Reject.png
    hidden: false
- select:
    name: 直連服務
    policies:
    - DIRECT
    icon: https://raw.githubusercontent.com/Qmxn/Tool/X/icon/Color/Direct.png
    hidden: false
- select:
    name: 香港區域
    policies:
    - 自選服務
    flatten: true
    filter: (?i)🇭🇰|香港|(\b(HK|Hong)\b)
    icon: https://raw.githubusercontent.com/Qmxn/Tool/X/icon/icon/Hong_Kong.png
    hidden: false
- select:
    name: 美國區域
    policies:
    - 自選服務
    flatten: true
    filter: (?i)🇺🇸|美国|洛杉矶|圣何塞|(\b(US|United States)\b)
    icon: https://raw.githubusercontent.com/Qmxn/Tool/X/icon/icon/United_States.png
    hidden: false
- select:
    name: 獅城區域
    policies:
    - 自選服務
    flatten: true
    filter: (?i)🇸🇬|新加坡|狮|(\b(SG|Singapore)\b)
    icon: https://raw.githubusercontent.com/Qmxn/Tool/X/icon/icon/Singapore.png
    hidden: false
- select:
    name: 日本區域
    policies:
    - 自選服務
    flatten: true
    filter: (?i)🇯🇵|日本|东京|(\b(JP|Japan)\b)
    icon: https://raw.githubusercontent.com/Qmxn/Tool/X/icon/icon/Japan.png
    hidden: false
- select:
    name: 台灣區域
    policies:
    - 自選服務
    flatten: true
    filter: (?i)🇨🇳|🇹🇼|台湾|(\b(TW|Tai|Taiwan)\b)
    icon: https://raw.githubusercontent.com/Qmxn/Tool/X/icon/icon/China.png
    hidden: false
- auto_test:
    name: 其他區域
    policies:
    - 自選服務
    flatten: true
    filter: ^((?!🇭🇰|港|HK|Hong|🇹🇼|台|TW|Tai|🇯🇵|日|JP|Japan|🇸🇬|坡|狮城|SG|Singapore|🇺🇸|美|US|States|American).)*$
    icon: https://raw.githubusercontent.com/Qmxn/Tool/X/icon/icon/Rainbow.png
    hidden: false
rules:
- rule_set:
    match: https://raw.githubusercontent.com/Qmxn/Tool/X/Egern/Rule/Direct/Direct.yaml
    policy: 直連服務
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/Qmxn/Tool/X/Egern/AdRule/AdBlock.yaml
    policy: 拒絕應答
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/Qmxn/Tool/X/Egern/Rule/BlockHttpDNS/BlockHttpDNS.yaml
    policy: 拒絕應答
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/Qmxn/Tool/X/Egern/Rule/Hijacking/Hijacking.yaml
    policy: 拒絕應答
