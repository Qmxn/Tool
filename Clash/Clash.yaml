    type: url-test
    interval: 300
  - icon: https://raw.githubusercontent.com/Qmxn/Box/X/icon/color/JP.png
    include-all: true
    exclude-filter: (?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
    filter: (?i)🇯🇵|日本|东京|(\b(JP|Japan)\b)
    name: 日本节点 
    type: url-test
    interval: 300
  - icon: https://raw.githubusercontent.com/Qmxn/Box/X/icon/color/US.png
    include-all: true
    exclude-filter: (?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
    filter: (?i)🇺🇸|美国|洛杉矶|圣何塞|(\b(US|United States)\b)
    name: 美国节点 
    type: url-test
    interval: 300
  - icon: https://raw.githubusercontent.com/Qmxn/Box/X/icon/color/Mihomo.png
    include-all: true
    name: GLOBAL
    type: select
    proxies:
      - 自行选择
      - 自动选择
      - 微软服务
      - 智能应答
      - 电报消息
      - 谷歌服务
      - 国际媒体
      - 国际服务
      - 兜底服务
      - 香港节点
      - 日本节点
      - 美国节点
      - 台湾节点
      - 狮城节点

rules:
  - "RULE-SET,规则修正,DIRECT"
  - "RULE-SET,广告拦截,REJECT"
  - "RULE-SET,微软服务,微软服务"
  - "RULE-SET,国际媒体,国际媒体"
  - "RULE-SET,国际服务,国际服务"
  - "RULE-SET,bing,智能应答"
  - "RULE-SET,Gemin,智能应答"
  - "RULE-SET,openai,智能应答"
  - "RULE-SET,电报消息,电报消息"
  - "RULE-SET,谷歌服务,谷歌服务"
