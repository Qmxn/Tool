    name: 台湾节点
    type: url-test
    interval: 300
  - icon: https://raw.githubusercontent.com/Qmxn/Box/X/icon/color/SG.png
    include-all: true
    exclude-filter: (?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
    filter: (?i)🇸🇬|新加坡|狮|(\b(SG|Singapore)\b)
